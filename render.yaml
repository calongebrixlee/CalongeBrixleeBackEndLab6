services:
  - type: web
    name: lavalust-products-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerPort: 80
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_DRIVER
        value: mysql
      - key: DB_HOST
        value: mysql-299de89-calongebrixlee-4300.e.aivencloud.com
      - key: DB_PORT
        value: "16360"
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: mydb
      - key: DB_SSL_CA
        value: /etc/secrets/ca.pem
      - key: FRONTEND_ORIGIN
        value: https://calongebrixleefrontendlab6.onrender.com
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_KEY
        generateValue: true

  - type: web
    name: lavalust-products-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://calongebrixleebackendlab6.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
